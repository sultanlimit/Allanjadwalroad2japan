<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist Harian Allan</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f2ec;
    color: #2c2c2a;
    padding: 1.25rem 1rem 3rem;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { font-size: 13px; color: #6b6a63; margin: 0 0 1.25rem; }
  .date-nav {
    display: flex; align-items: center; justify-content: space-between;
    background: #fff; border: 1px solid #e4e1d6; border-radius: 12px;
    padding: 10px 12px; margin-bottom: 1rem;
  }
  .date-nav button {
    border: none; background: #efeee6; border-radius: 8px;
    width: 32px; height: 32px; font-size: 16px; cursor: pointer;
  }
  .date-nav .label { font-size: 14px; font-weight: 500; text-align: center; flex: 1; }
  .streak {
    display: flex; gap: 10px; margin-bottom: 1rem;
  }
  .streak .card {
    flex: 1; background: #fff; border: 1px solid #e4e1d6; border-radius: 12px;
    padding: 10px; text-align: center;
  }
  .streak .num { font-size: 22px; font-weight: 600; }
  .streak .lbl { font-size: 11px; color: #6b6a63; margin-top: 2px; }
  .section {
    background: #fff; border: 1px solid #e4e1d6; border-radius: 12px;
    padding: 4px 0; margin-bottom: 1rem; overflow: hidden;
  }
  .section h2 {
    font-size: 13px; font-weight: 600; color: #6b6a63;
    text-transform: uppercase; letter-spacing: 0.03em;
    padding: 10px 14px 6px;
  }
  .item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-top: 1px solid #f0eee6;
    cursor: pointer; user-select: none;
  }
  .item:first-of-type { border-top: none; }
  .box {
    width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
    border: 1.5px solid #c9c6b9; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, border-color 0.15s;
  }
  .box.checked { background: #3c8a5f; border-color: #3c8a5f; }
  .box svg { display: none; width: 13px; height: 13px; }
  .box.checked svg { display: block; }
  .item .txt { font-size: 14.5px; flex: 1; }
  .item.done .txt { color: #9a988e; text-decoration: line-through; }
  .progress-bar {
    height: 6px; background: #efeee6; border-radius: 3px; margin: 0 14px 12px; overflow: hidden;
  }
  .progress-fill { height: 100%; background: #3c8a5f; border-radius: 3px; transition: width 0.2s; }
  .footer-note {
    font-size: 12px; color: #9a988e; text-align: center; margin-top: 1.5rem; line-height: 1.6;
  }
  .reset-btn {
    display: block; width: 100%; margin-top: 1rem; padding: 10px;
    background: #fff; border: 1px solid #e4e1d6; border-radius: 10px;
    font-size: 13px; color: #a34a3a; cursor: pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Checklist harian Allan</h1>
  <p class="sub">Fokus konsisten, bukan sempurna 🎯</p>

  <div class="date-nav">
    <button id="prevDay">‹</button>
    <div class="label" id="dateLabel">Hari ini</div>
    <button id="nextDay">›</button>
  </div>

  <div class="streak">
    <div class="card"><div class="num" id="streakNum">0</div><div class="lbl">hari beruntun</div></div>
    <div class="card"><div class="num" id="weekNum">0/7</div><div class="lbl">minggu ini</div></div>
  </div>

  <div class="section">
    <h2>Bahasa Jepang</h2>
    <div id="jp-items"></div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="jp-bar"></div></div>

  <div class="section">
    <h2>Sehat & rutin</h2>
    <div id="health-items"></div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="health-bar"></div></div>

  <div class="section">
    <h2>Olahraga / boxing</h2>
    <div id="sport-items"></div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="sport-bar"></div></div>

  <button class="reset-btn" id="resetBtn">Reset hari ini</button>

  <p class="footer-note">Progres kesimpan otomatis per hari.<br>Bolak-balik tanggal buat lihat riwayat.</p>
</div>

<script>
const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

const TASKS = {
  jp: [
    { id: 'jp1', txt: 'Belajar Jepang minimal 1.5–2 jam (kosakata + grammar)' },
    { id: 'jp2', txt: 'Review kosakata (hari ini + kemarin)' },
    { id: 'jp3', txt: 'Immersion santai (nonton/dengar Jepang) — opsional' },
  ],
  health: [
    { id: 'h1', txt: 'Tidur sebelum jam 23.30' },
    { id: 'h2', txt: 'Makan teratur (3x) + cukup minum air' },
  ],
  sport: [
    { id: 's1', txt: 'Olahraga hari ini (boxing/cardio/stretching sesuai jadwal)' },
  ],
};

function pad(n) { return String(n).padStart(2, '0'); }
function fmtKey(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function fmtLabel(d) {
  const today = new Date(); today.setHours(0,0,0,0);
  const cmp = new Date(d); cmp.setHours(0,0,0,0);
  const diff = Math.round((cmp - today) / 86400000);
  if (diff === 0) return 'Hari ini';
  if (diff === -1) return 'Kemarin';
  const days = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
  return `${days[d.getDay()]}, ${d.getDate()}/${d.getMonth()+1}`;
}

let currentDate = new Date();
let dataCache = {};

async function loadDay(key) {
  if (dataCache[key]) return dataCache[key];
  try {
    const res = await window.storage.get('checklist:allan:' + key);
    const val = res ? JSON.parse(res.value) : {};
    dataCache[key] = val;
    return val;
  } catch (e) {
    dataCache[key] = {};
    return {};
  }
}

async function saveDay(key, val) {
  dataCache[key] = val;
  try {
    await window.storage.set('checklist:allan:' + key, JSON.stringify(val));
  } catch (e) {}
}

function allTaskIds() {
  return [...TASKS.jp, ...TASKS.health, ...TASKS.sport].map(t => t.id);
}

function renderSection(containerId, list, dayData) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  list.forEach(t => {
    const checked = !!dayData[t.id];
    const row = document.createElement('div');
    row.className = 'item' + (checked ? ' done' : '');
    row.innerHTML = `<div class="box${checked ? ' checked' : ''}">${CHECK_SVG}</div><div class="txt">${t.txt}</div>`;
    row.addEventListener('click', () => toggle(t.id));
    el.appendChild(row);
  });
}

function updateBars(dayData) {
  ['jp','health','sport'].forEach(sec => {
    const list = TASKS[sec];
    const done = list.filter(t => dayData[t.id]).length;
    const pct = list.length ? Math.round((done / list.length) * 100) : 0;
    document.getElementById(sec + '-bar').style.width = pct + '%';
  });
}

async function computeStreak() {
  let streak = 0;
  let d = new Date();
  for (let i = 0; i < 365; i++) {
    const key = fmtKey(d);
    const day = await loadDay(key);
    const ids = allTaskIds();
    const requiredDone = ids.filter(id => !id.includes('3')).every(id => day[id]);
    if (requiredDone && Object.keys(day).length > 0) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else break;
  }
  document.getElementById('streakNum').textContent = streak;
}

async function computeWeek() {
  let count = 0;
  let d = new Date();
  for (let i = 0; i < 7; i++) {
    const key = fmtKey(d);
    const day = await loadDay(key);
    if (Object.values(day).some(v => v)) count++;
    d.setDate(d.getDate() - 1);
  }
  document.getElementById('weekNum').textContent = count + '/7';
}

async function render() {
  const key = fmtKey(currentDate);
  document.getElementById('dateLabel').textContent = fmtLabel(currentDate);
  const dayData = await loadDay(key);
  renderSection('jp-items', TASKS.jp, dayData);
  renderSection('health-items', TASKS.health, dayData);
  renderSection('sport-items', TASKS.sport, dayData);
  updateBars(dayData);
  await computeStreak();
  await computeWeek();
}

async function toggle(id) {
  const key = fmtKey(currentDate);
  const dayData = await loadDay(key);
  dayData[id] = !dayData[id];
  await saveDay(key, dayData);
  await render();
}

document.getElementById('prevDay').addEventListener('click', () => {
  currentDate.setDate(currentDate.getDate() - 1);
  render();
});
document.getElementById('nextDay').addEventListener('click', () => {
  const today = new Date(); today.setHours(0,0,0,0);
  const next = new Date(currentDate); next.setDate(next.getDate() + 1); next.setHours(0,0,0,0);
  if (next <= today) {
    currentDate.setDate(currentDate.getDate() + 1);
    render();
  }
});
document.getElementById('resetBtn').addEventListener('click', async () => {
  const key = fmtKey(currentDate);
  await saveDay(key, {});
  await render();
});

render();
</script>
</body>
</html>
